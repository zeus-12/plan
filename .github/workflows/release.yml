name: Release

# How to cut a release:
#   1. Bump the version (e.g. `cd apps/desktop && npm version patch --no-git-tag-version`)
#   2. Commit it, then create and push a matching tag:
#        git tag v0.1.1 && git push origin v0.1.1
#   The tag push triggers this workflow, builds the macOS DMGs, and publishes a
#   GitHub Release with them attached.
#
# You can also trigger a manual *test* build from the Actions tab (workflow_dispatch).
# Manual runs build the DMGs and attach them as run artifacts, but do NOT publish a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Cancel an in-flight run if a newer one starts for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required to create the GitHub Release

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            arch: arm64
          - runner: macos-13 # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION"
          (cd apps/desktop && npm pkg set version="$VERSION")

      # node-pty is a native module — rebuild it against Electron's ABI before packaging.
      - name: Rebuild native modules
        run: pnpm --filter @plan/desktop run rebuild

      - name: Build app bundle
        run: pnpm --filter @plan/desktop exec electron-vite build

      - name: Package DMG
        env:
          # We don't have an Apple Developer ID yet — build unsigned rather than
          # letting electron-builder hunt for (and fail on) a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: >
          pnpm --filter @plan/desktop exec electron-builder
          --mac dmg --${{ matrix.arch }} --publish never

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all DMGs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
