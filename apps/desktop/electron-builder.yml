appId: com.plan.desktop
productName: Plan
# Include the arch so the Intel and Apple Silicon DMGs don't overwrite each other.
artifactName: ${productName}-${version}-${arch}.dmg
# Native modules are rebuilt explicitly (CI step / `pnpm rebuild`), so don't let
# electron-builder rebuild them itself — that path is flaky under pnpm.
npmRebuild: false
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
mac:
  icon: build/icon.icns
  target:
    - dmg
  category: public.app-category.developer-tools
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
